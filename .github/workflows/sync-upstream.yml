name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Clone upstream
        run: |
          rm -rf /tmp/upstream
          git clone --depth 1 https://github.com/sansan0/TrendRadar.git /tmp/upstream

      - name: Sync files
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'README*.md' \
            --exclude 'config/frequency_words.txt' \
            --exclude 'config/custom' \
            --exclude '.github/workflows/sync-upstream.yml' \
            --exclude '.github/workflows/crawler-backup.yml' \
            /tmp/upstream/ ./

      - name: Re-apply OilPrice RSS feed
        run: |
          python3 - <<'PY'
          import io, sys
          p = 'config/config.yaml'
          s = io.open(p, encoding='utf-8').read()
          if 'oilprice' in s:
              print('OilPrice feed already present')
              sys.exit(0)
          anchor = ('    - id: "yahoo-finance"\n'
                    '      name: "雅虎财经"\n'
                    '      url: "https://finance.yahoo.com/news/rssindex"\n')
          feed = ('\n    - id: "oilprice"\n'
                  '      name: "OilPrice"\n'
                  '      url: "https://oilprice.com/rss/main"\n')
          if anchor not in s:
              print('ERROR: yahoo anchor not found; upstream config changed, oil feed NOT added')
              sys.exit(1)
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s.replace(anchor, anchor + feed, 1))
          print('OilPrice feed added')
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "Upstream already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync upstream $(date -u +%Y-%m-%d)"
          git push
